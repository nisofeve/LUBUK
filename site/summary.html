<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1120">
  <meta name="description" content="Browse every LUBUK game in one table, with platforms, summaries, and links to game details.">
  <title>Game Summary | LUBUK</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./games-data.js" defer></script>

  <header class="site-header">
    <a class="brand" href="./" aria-label="LUBUK Game Archive home"><span class="brand-mark">L<span>.</span></span><span>LUBUK <small>GAME ARCHIVE</small></span></a>

  <main>
    <section class="section summary-section" aria-labelledby="summary-title">
      <p class="eyebrow">LUBUK / ALL GAMES</p>

  <footer><span>LUBUK · GAME ARCHIVE</span><a href="./">Back to games ↗</a></footer>
